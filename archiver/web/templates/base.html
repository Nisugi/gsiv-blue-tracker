<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ server_name }} {{ label }} Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/choices.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script defer src="{{ url_for('static', filename='vendor/choices.min.js') }}"></script>
  <script>window.SITE = {{ {"serverName": server_name, "label": label, "guildId": guild_id} | tojson }};</script>
  <script defer src="{{ url_for('static', filename='common.js') }}"></script>
  {% block scripts %}{% endblock %}
</head>
<body>
<div class="container">
  {% block body %}{% endblock %}
</div>
</body>
</html>
